{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align:center; margin-bottom: 25px;">
    <h1 style="font-size: 2.5rem; color: #e50914;">
        Gender Prediction on Netflix
    </h1>
    <p style="color: var(--text-dim);">
        Discover the main genre of a movie or series based on its description using NLP.
    </p>
</div>

<div style="display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 600px; margin: 0 auto;">
    
    <div class="card">
        <form method="POST" style="display: flex; flex-direction: column; align-items: stretch; gap: 15px;">
            <label for="descripcion" style="color: var(--text-main); font-weight: bold; font-size: 1.1rem; text-align: left;">
                Description (in English):
            </label>
            <textarea id="descripcion" name="descripcion" 
                placeholder="Ej: A young boy discovers he has magical powers..." rows="4" required
                style="padding: 15px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main); font-size: 1rem; font-family: inherit; resize: vertical;"></textarea>
            
            <button type="submit" 
                style="background: #e50914; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;">
                Predict Genre
            </button>
        </form>
    </div>

    {% if result is not none %}
    <div class="card" style="text-align: center; border-left: 5px solid #e50914;">
        <h2 style="color: #e50914; margin-bottom: 5px;">Estimated Genre</h2>
        <p style="font-size: 1.5rem; font-weight: bold; color: var(--text-main); margin-top: 5px;">
            {{ result }}
        </p>
    </div>
    {% endif %}

</div>
{% endblock %}
